name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - mkdocs  # Deploy only when changes are merged to main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Build the site
        run: mkdocs build  # Generates the "site/" directory

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site  # Uploads the built MkDocs site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
